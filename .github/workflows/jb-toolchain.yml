name: jb toolchain

# 构建越狱注入工具箱的二进制产物（不是 DSH Go App 本体）
#
# 触发：push 到 main / feat/** / jb/** 且改动命中 jb/**；或手动 workflow_dispatch
# 不会和 ci.yml、ios-compile.yml 抢：那些 workflow 的 paths 不包含 jb/**

on:
  push:
    branches: [main, 'feat/**', 'jb/**']
    paths:
      - 'jb/**'
      - '.github/workflows/jb-toolchain.yml'
  pull_request:
    branches: [main]
    paths:
      - 'jb/**'
      - '.github/workflows/jb-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-helper:
    name: Build jbhelper (iOS arm64)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 交叉编译 jbhelper.m
        run: |
          set -euo pipefail
          mkdir -p out
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -fobjc-arc -O2 -Wall -Wextra \
            -framework Foundation \
            -o out/jbhelper \
            jb/helper/jbhelper.m
          file out/jbhelper
          otool -L out/jbhelper

      - name: 校验 Mach-O 只依赖系统库
        run: |
          set -euo pipefail
          otool -L out/jbhelper
          if otool -L out/jbhelper | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'; then
            echo "== 出现非系统依赖，检查编译参数 =="
            exit 1
          fi

      - name: 伪签名（可选，越狱设备 amfi 已 patch 时可省）
        run: |
          set -euo pipefail
          if command -v ldid >/dev/null 2>&1; then
            ldid -S out/jbhelper
            ldid -e out/jbhelper | head -20 || true
          else
            echo "未安装 ldid，跳过；rootless 越狱下不签也能跑"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jbhelper-iphoneos-arm64
          path: out/jbhelper
          if-no-files-found: error
          retention-days: 30

  build-tweak:
    name: Build tweak (Theos, rootless)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Theos
        run: |
          set -euo pipefail
          brew install ldid xz
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls "$THEOS/sdks" || echo "sdks 目录为空，下一步安装 SDK"

      - name: 把 Xcode 的 iOS SDK 接给 Theos
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_NAME="$(basename "$SDK_PATH")"
          echo "Xcode SDK: $SDK_PATH"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$SDK_PATH" "$THEOS/sdks/$SDK_NAME"
          ls -l "$THEOS/sdks"

      - name: make package
        run: |
          set -euo pipefail
          cd jb/tweak-template
          make package THEOS="$THEOS" FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0
          # 一个 scheme 包的 .deb 落在 ./packages；.theos/_/debs 只有 rootful 才有。
          # 把目录写死，rootless 下就必然 not found —— 于是 find 出来，交给下一步。
          deb="$(find . -name '*.deb' -type f -print -quit)"
          if [ -z "$deb" ]; then
            echo "== make package 没有产出 .deb，列出建出来的目录 =="
            find . -maxdepth 3 -type d | sort
            exit 1
          fi
          # 绝对路径：下面 ar 那步会 cd 到临时目录，相对的 $deb 到那里就找不到了。
          deb="$(cd "$(dirname "$deb")" && pwd)/$(basename "$deb")"
          echo "DEB_DIR=$(dirname "$deb")" >> "$GITHUB_ENV"
          ls -l "$deb"
          # rootless 包的文件必须装在 /var/jb 下，装到 RootHide 上才生效。
          # dpkg-deb 不在 runner 上，所以直接看 deb 里的 data.tar。
          work="$(mktemp -d)"
          ( cd "$work" && ar x "$deb" )
          payload="$(ls "$work"/data.tar.* 2>/dev/null | head -n 1)"
          listing=""
          case "$payload" in
            *.gz)  listing="$(tar -tzf "$payload")" ;;
            *.xz)  listing="$(tar -tJf "$payload")" ;;
            *.zst) listing="$(tar --zstd -tf "$payload")" ;;
          esac
          printf '%s\n' "$listing" | head -20
          if [ -n "$listing" ] && ! printf '%s\n' "$listing" | grep -q 'var/jb/'; then
            echo "== 包里没有 /var/jb 前缀：不是 rootless 包，RootHide 上不会生效 =="
            exit 1
          fi

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: ${{ env.DEB_DIR }}/*.deb
          if-no-files-found: error
          retention-days: 30

  summary:
    name: jb toolchain OK
    if: always()
    needs: [build-helper, build-tweak]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
