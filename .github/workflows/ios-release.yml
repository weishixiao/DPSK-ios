# Builds an installable .ipa of the app on a macOS runner, on demand.
#
# Nothing here is on a push trigger: `iOS compile` already checks that the app
# compiles, and a 120 MB artifact on every commit would be weight nobody asked for.
# This is the door for "give me a build I can install", and it stays shut until
# somebody opens it.
#
# The environment is the one `iOS compile` proved - the same runner image, the same
# Xcode, the same Flutter, pinned by the same sha256 - so a release build differs
# from a compile check in packaging only, not in toolchain.
#
# The engine is prepared, not assumed. `app/ios/Engine/` is gitignored: it holds the
# pinned NodeMobile, the runtime archive and the addon sources, and
# `tooling/ios/prepare-engine.sh` builds it from the network. Without it the Xcode
# build phase `embed-engine.sh` prints "this build connects to remote hosts only"
# and exits 0 - the app still compiles, ships at half the size, and tells the person
# holding it that the local engine is not installed. So the first version of this
# workflow produced exactly that: 51 MB, no engine, and nothing in the UI to install
# one with, because at that size there was never meant to be one. prepare-engine.sh
# runs below, and `Check the engine is in the bundle` refuses to package an app that
# came out without it.
#
# The .ipa is unsigned. Signing is the installer's business: on a jailbroken device
# that means ldid with the entitlements in agent/service/Runner.jailbreak.entitlements
# (sign-app.sh applies them), or a signing service for a stock one. A workflow run on
# a hosted runner has no certificate to sign with, and inventing one would produce a
# file that installs nowhere.
name: iOS release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Version name for the .ipa (empty reads app/pubspec.yaml)
        type: string
        default: ''
      publish:
        description: Publish the .ipa as a GitHub release, not just an artifact
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone

      - name: Install Flutter
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          flutter --version
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      # `embed-engine.sh` builds the guest addon during the Xcode build, so the
      # toolchain it needs has to be there before flutter runs: Homebrew ships
      # ld.lld in its own formula now, and meson/ninja live in a venv rather than
      # in the image.
      - name: Install the guest build tools
        run: |
          set -euo pipefail
          brew install llvm lld
          python3 -m venv "$RUNNER_TEMP/ish-tools"
          "$RUNNER_TEMP/ish-tools/bin/pip" install meson==1.7.2 ninja==1.11.1.4
          echo "$RUNNER_TEMP/ish-tools/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix lld)/bin:$PATH" ld.lld --version

      # Same key as `iOS compile`'s engine job, so a release build reuses the iSH
      # frameworks that job already compiled instead of rebuilding them. The key
      # is the hash of both slices' inputs, which is how build-ish.sh pins them.
      - name: Identify the pinned iSH build inputs
        id: ish-inputs
        run: |
          set -euo pipefail
          device="$(bash tooling/ios/build-ish.sh --cache-key iphoneos)"
          simulator="$(bash tooling/ios/build-ish.sh --cache-key iphonesimulator)"
          key="$(printf '%s\n%s\n' "$device" "$simulator" | shasum -a 256 | cut -d' ' -f1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Must precede the cache restore: prepare-engine.sh replaces the whole
      # directory, so a restored build/ underneath it would be thrown away.
      - name: Prepare the engine
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if ! bash tooling/ios/prepare-engine.sh 2>&1 | tee "$log"; then
            tail -n 12 "$log" | cut -c1-600 | sed -e 's/%/%25/g' -e 's/^/::error title=prepare-engine::/'
            exit 1
          fi
          test -f app/ios/Engine/.ready
          ls -la app/ios/Engine

      - name: Restore the iSH frameworks
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/ios/Engine/ish-cache
            app/ios/Engine/build/iphoneos/guest
            app/ios/Engine/build/iphonesimulator/guest
          key: ${{ runner.os }}-ish-${{ steps.ish-inputs.outputs.key }}

      - name: Compile for a device, unsigned
        working-directory: app
        run: bash ../tooling/ios/build.sh --release --no-codesign

      # The reason this workflow exists twice over: a bundle that builds is not a
      # bundle that has the engine. 51 MB with no dsh-runtime is what "success"
      # looks like when prepare-engine.sh was skipped, so the packaging step below
      # is not allowed to run until these files are here.
      - name: Check the engine is in the bundle
        working-directory: app
        run: |
          set -euo pipefail
          bundle="build/ios/iphoneos/Runner.app"
          for path in \
            "$bundle/dsh-runtime/runtime.zip" \
            "$bundle/Frameworks/NodeMobile.framework/NodeMobile" \
            "$bundle/Frameworks/DshNodeHost.framework/DshNodeHost" \
            "$bundle/Frameworks/DshFlock.framework/DshFlock" \
            "$bundle/Frameworks/DshRequireBuiltin.framework/DshRequireBuiltin" \
            "$bundle/Frameworks/DshGuest.framework/DshGuest" \
            "$bundle/Frameworks/DshGuestBridge.framework/DshGuestBridge" \
            "$bundle/dsh-runtime/phone/catalog.json"; do
            if [ ! -e "$path" ]; then
              echo "::error title=engine missing::The app bundle has no ${path#$bundle/} - it would install without a local engine."
              exit 1
            fi
          done
          echo "::notice title=iOS release::engine embedded, bundle $(du -sh "$bundle" | cut -f1)"

      # `flutter build ios` leaves the app bundle; the .ipa is the Payload directory
      # zipped. This is the whole packaging step - no archive, no export options, no
      # provisioning profile to resolve.
      - name: Package the .ipa
        id: package
        working-directory: app
        run: |
          set -euo pipefail
          name='${{ inputs.build_name }}'
          if [ -z "$name" ]; then
            name="$(sed -n 's/^version:[[:space:]]*\([^+]*\)+.*/\1/p' pubspec.yaml)"
          fi
          if [ -z "$name" ]; then
            echo '::error::No version: neither the input nor app/pubspec.yaml has one.'
            exit 1
          fi
          bundle="build/ios/iphoneos/Runner.app"
          if [ ! -d "$bundle" ]; then
            echo "::error::$bundle was not produced."
            exit 1
          fi
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/Payload"
          cp -R "$bundle" "$stage/Payload/Runner.app"
          ipa="$RUNNER_TEMP/DPSK-ios-$name-unsigned.ipa"
          ( cd "$stage" && zip -qry "$ipa" Payload )
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "$ipa"
          echo "::notice title=iOS release::$name, $(du -h "$ipa" | cut -f1) unsigned, engine included"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v5.0.0
        with:
          name: ios-ipa
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error

      # Off unless asked for: a build that publishes itself would put a binary in
      # front of people on a branch tip that nobody chose to release.
      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name='${{ steps.package.outputs.name }}'
          ipa='${{ steps.package.outputs.ipa }}'
          tag="v$name"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ipa" --clobber
            echo "::notice title=iOS release::replaced the asset on $tag"
          else
            gh release create "$tag" "$ipa" \
              --title "$tag build ${{ github.run_number }}" \
              --notes "Unsigned ipa built from ${{ github.sha }}, engine included. Sign with your own certificate."
            echo "::notice title=iOS release::created $tag"
          fi