name: probe runners
on:
  push:
    branches: ['feat/probe-runners']
  workflow_dispatch:
jobs:
  probe:
    name: probe ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - run: |
          echo "hello from ${{ matrix.os }}"
          uname -a || true
